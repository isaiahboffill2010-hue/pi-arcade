name: verify
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:content
      - if: runner.os == 'Linux'
        run: bash scripts/install-pi.sh --dry-run --allow-non-pi --no-autostart
      - if: runner.os == 'Linux'
        run: bash scripts/install-pi.sh --dry-run --allow-non-pi --no-autostart
  arm64-package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run package:pi
      - uses: actions/upload-artifact@v4
        with: { name: pi-arcade-arm64, path: dist/*arm64.AppImage }

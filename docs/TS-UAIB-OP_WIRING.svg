<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TS-UAIB-OP V1.0 safe cabinet wiring</title>
  <desc id="desc">Logical silkscreen-up diagram using the labeled direction, button, start and select inputs. The five-pin header is left unused because its orientation is unverified.</desc>
  <style>.board{fill:#166534;stroke:#052e16;stroke-width:8}.port{fill:#fff;stroke:#111827;stroke-width:3}.label{font:700 22px sans-serif;fill:#111827}.small{font:17px sans-serif;fill:#374151}.wire{fill:none;stroke-width:5}.punch{stroke:#ef4444}.kick{stroke:#3b82f6}.unused{stroke:#9ca3af}.system{stroke:#f59e0b}.joy{stroke:#8b5cf6}.warn{fill:#fef3c7;stroke:#f59e0b;stroke-width:3}</style>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="48" class="label">TS-UAIB-OP V1.0 — label-matched wiring (silkscreen side up; not to scale)</text>
  <rect x="285" y="105" width="630" height="440" rx="25" class="board"/>
  <rect x="320" y="130" width="120" height="48" rx="8" class="port"/><text x="342" y="162" class="label">USB</text>
  <rect x="490" y="130" width="170" height="48" rx="8" class="warn"/><text x="515" y="161" class="label">J4 UNUSED</text>
  <text x="470" y="202" class="small">5-pin order/orientation unverified</text>
  <g><rect x="735" y="130" width="62" height="42" class="port"/><text x="748" y="158" class="label">AU</text><rect x="810" y="130" width="62" height="42" class="port"/><text x="823" y="158" class="label">AD</text><rect x="735" y="185" width="62" height="42" class="port"/><text x="748" y="213" class="label">AL</text><rect x="810" y="185" width="62" height="42" class="port"/><text x="823" y="213" class="label">AR</text></g>
  <g><rect x="330" y="465" width="58" height="42" class="port"/><text x="344" y="493" class="label">K1</text><rect x="395" y="465" width="58" height="42" class="port"/><text x="409" y="493" class="label">K2</text><rect x="460" y="465" width="58" height="42" class="port"/><text x="474" y="493" class="label">K3</text><rect x="525" y="465" width="58" height="42" class="port"/><text x="539" y="493" class="label">K4</text><rect x="590" y="465" width="58" height="42" class="port"/><text x="604" y="493" class="label">K5</text><rect x="655" y="465" width="58" height="42" class="port"/><text x="669" y="493" class="label">K6</text><rect x="720" y="465" width="58" height="42" class="port"/><text x="734" y="493" class="label">K7</text><rect x="785" y="465" width="58" height="42" class="port"/><text x="799" y="493" class="label">K8</text><rect x="850" y="465" width="50" height="42" class="port"/><text x="859" y="493" class="label">ST</text><rect x="850" y="410" width="50" height="42" class="port"/><text x="858" y="438" class="label">SE</text></g>
  <text x="70" y="610" class="label">Panel button layout</text>
